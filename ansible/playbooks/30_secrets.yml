---
- name: Hosts hold their secret tooling and a live 1Password token in memory
  hosts: all
  tags: [secrets]

  tasks:
    - name: Secrets and credentials directories are tmpfs mounts
      ansible.builtin.import_role:
        name: tmpfs

    - name: Fnox, the 1Password CLI and docker-compose-fnox are installed
      ansible.builtin.import_role:
        name: compose_fnox

    - name: 1Password service-account token is minted, stored and placed
      ansible.builtin.import_role:
        name: onepass_service_account
