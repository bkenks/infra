---
- name: Look for active swap
  ansible.builtin.command: swapon --noheadings
  changed_when: false
  check_mode: false
  register: system__active_swap

- name: Create and enable a swap file
  when: system__active_swap.stdout == ''
  block:
    - name: Allocate a root-only swap file
      community.general.filesize:
        path: "{{ system__swap_file }}"
        size: "{{ system__swap_size }}"
        owner: root
        group: root
        mode: "0600"

    - name: Format the swap file
      ansible.builtin.command: "mkswap {{ system__swap_file }}"
      changed_when: true

    - name: Enable the swap file
      ansible.builtin.command: "swapon {{ system__swap_file }}"
      changed_when: true

- name: Mount the swap file at boot
  ansible.posix.mount:
    path: none
    src: "{{ system__swap_file }}"
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ system__swappiness }}"
    sysctl_file: /etc/sysctl.d/60-swappiness.conf
