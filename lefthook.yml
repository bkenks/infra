---
pre-commit:
  jobs:
    - name: "ANSIBLE | lint"
      root: "ops/automation/"
      glob: "*.{yml,yaml}"
      run: uv run ansible-lint --offline {staged_files}

    - name: "KSTORE | pack automation"
      root: "ops/automation/"
      run: mise run kstore:pack --stage

    - name: "KSTORE | pack state"
      root: "ops/state/"
      run: mise run kstore:pack --stage

    - name: "KSTORE | pack services"
      root: "ops/services/"
      run: mise run kstore:pack --stage
