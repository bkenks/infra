# ─────────────────────────────────────────────────────────────────────────────
# Configarr — config-as-code for Sonarr + Radarr quality.
# ─────────────────────────────────────────────────────────────────────────────
# This file IS the config-as-code: it declares the TRaSH-guide quality
# definitions, quality profiles, and custom formats that Configarr syncs into
# Sonarr and Radarr on every deploy. Edit it here, commit, redeploy — the running
# *arr instances converge to match. It does NOT touch indexers (that's Prowlarr),
# download clients, root folders, or media — only quality scoring.
#
# Docs: https://configarr.de/docs/configuration/config-file/
# TRaSH template names: https://recyclarr.dev/wiki/  (Configarr uses the same set)
#
# API keys come from the container environment (fnox) via
# `!env` below — never hard-code them here. base_url uses the compose service
# name on the `default` network.

telemetry: false

sonarr:
  series:
    base_url: http://tv:8989
    api_key: !env SONARR_API_KEY
    quality_definition:
      type: series
    include:
      # TRaSH 1080p WEB profile + its custom formats. Swap the two `web-1080p`
      # lines for the `web-2160p` equivalents if you move this library to 4K.
      - template: sonarr-quality-definition-series
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-custom-formats-web-1080p

radarr:
  movies:
    base_url: http://movies:7878
    api_key: !env RADARR_API_KEY
    quality_definition:
      type: movie
    include:
      # TRaSH HD Bluray + WEB profile (1080p) and its custom formats. Swap for the
      # `uhd-bluray-web` templates if you move this library to 4K.
      - template: radarr-quality-definition-movie
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web
