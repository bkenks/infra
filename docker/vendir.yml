apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
- path: vendor/compose-spec
  contents:
  - path: .
    git:
      url: https://github.com/compose-spec/compose-spec.git
      ref: 914ec15d1fa498969c0df5c1d672306db3256089
      depth: 1
    includePaths:
      - schema/compose-spec.json
- path: vendor/frappe
  contents:
  - path: .
    git:
      url: git@github.com:frappe/frappe_docker.git
      ref: v4.0.1
      depth: 1
    includePaths:
      - compose.y*ml
      - example.env
      - .dockerignore
      - overrides/compose.{mariadb,migrator,redis}.y*ml
      - resources/core/{main-entrypoint,start}.sh
      - images/layered/**/*
