[tools]
pkl = "0.32.1"
vendir = "0.46"
lefthook = "2"
yq = "4"
"aqua:sharkdp/fd" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"npm:likec4" = "1"

[hooks]
postinstall = "lefthook install"

[vars]
path_c4 = "docs/c4"

[tasks."cue:update"]
description = "Refresh Compose spec and regenerate CUE"
dir = "schema/compose"
vars = { specURL = "https://raw.githubusercontent.com/compose-spec/compose-spec/main/schema/compose-spec.json" }
run = [
  "curl -fsSL -o compose-spec.json {{vars.specURL}}",
  "cue import -f -p compose -l '#Compose:' jsonschema: compose-spec.json -o compose-spec_gen.cue",
  "jq -r -f service-keys.jq compose-spec.json > service-keys.cue",
]

[tasks."cue:render"]
description = "Export every CUE stack to a compose.yaml beside it"
run = """
set -euo pipefail
for dir in stacks/*/; do
  rendered=$(cue export "./$dir" -e stack --out yaml)
  printf '# GENERATED from CUE — DO NOT EDIT.\\n%s\\n' "$rendered" > "${dir}compose.yaml"
  docker compose -f "${dir}compose.yaml" config --quiet --no-interpolate
done
"""

[tasks.check]
description = "Validate every rendered compose document with docker compose"
run = """
set -euo pipefail
for f in $(fd --glob 'compose.yaml' src) $(fd --glob 'bootstrap.yaml' src); do
  HOST=check BOOTSTRAP_SECRETS_FILE=/dev/null docker compose -f "$f" config --quiet || { echo "check: $f failed" >&2; exit 1; }
done
"""


# DOCS —————————————————————
[tasks."c4:validate"]
description = "Validate the LikeC4 model"
run = "likec4 validate --json --no-layout {{vars.path_c4}}"

[tasks."c4:build"]
description = "Build the LikeC4 site into docs/c4/dist"
run = "likec4 build -o {{vars.path_c4}}/dist {{vars.path_c4}}/diagram"

[tasks."c4:serve"]
description = "Serve LikeC4 diagrams locally"
run = "likec4 serve {{vars.path_c4}}"
