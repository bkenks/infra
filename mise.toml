#:schema https://mise.jdx.dev/schema/mise.json


[tools]
cue            = "0.17.1"
lefthook       = "2"
"npm:likec4"   = "1"
"npm:wrangler" = "4"
opentofu       = "1.13"
prettier       = "3.9.10"
taplo          = "0.10.0"
treefmt        = "2.6.0"
uv             = "0.13.0"
vendir         = "0.46.2"


[vars]
config_dir    = "{{config_root}}/.config"
repo_template = "https://github.com/bkenks/tmpl.repo"


[tasks]
"copier:copy"  = "copier copy --trust {{vars.repo_template}} ."
"copier:pull"  = "copier update --trust -a {{vars.config_dir}}/.copier-answers.configs.yml"
"cue:vet"      = "cue vet -c ./..."
"enable-tasks" = "fd -H -t d -g --full-path '**/.config/mise/tasks' -X chmod -R +x"
"format"       = "treefmt"
"vendir:pull"  = "vendir sync"
"open-ansible" = "codium {{config_root}}/ops/automation"

[tasks."docker:build:fnox"]
description = 'Build and push image: {{vars.image_ref}}'
dir = "ops/services/images/fnox"
vars.platforms = "linux/amd64,linux/arm64"
vars.image_ref = "ghcr.io/bkenks/fnox"
vars.sem_major = 0
vars.sem_minor = 2
vars.sem_patch = 1
run = '''
version="{{vars.sem_major}}.{{vars.sem_minor}}.{{vars.sem_patch}}"

docker buildx build \
  --platform {{vars.platforms}} \
  --annotation "index:org.opencontainers.image.source=https://github.com/bkenks/infra" \
  -t "{{vars.image_ref}}:$version" \
  -t "{{vars.image_ref}}:{{vars.sem_major}}" \
  -t "{{vars.image_ref}}:latest" \
  --push .
'''