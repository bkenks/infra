#:schema https://mise.jdx.dev/schema/mise.json


[tools]
cue            = "0.17.1"
lefthook       = "2"
"npm:wrangler" = "4"
opentofu       = "1.13"
prettier       = "3.9.10"
taplo          = "0.10.0"
treefmt        = "2.6.0"
uv             = "0.13.0"
vendir         = "0.46.2"


[vars]
config_dir    = "{{config_root}}/.config"
repo_template = "https://github.com/bkenks/tmpl.repo"


# —————————————————————————————————————————————————
[tasks."enable-tasks"]
description = 'Make task scripts executable'
run         = "fd -H -t d -g --full-path '**/.config/mise/tasks' -X chmod -R +x"

[tasks.format]
description = 'Format files'
run         = "treefmt"

[tasks."open-ansible"]
description = 'Open Ansible configuration in VSCodium'
run         = "codium {{config_root}}/ops/automation"

# —————————————————————————————————————————————————
[tasks."copier:copy"]
description = 'Copy files from the repository template'
run         = "copier copy --trust {{vars.repo_template}} ."

[tasks."copier:pull"]
description = 'Update files from the repository template'
run         = "copier update --trust -a {{vars.config_dir}}/.copier-answers.configs.yml"

[tasks."vendir:pull"]
description = 'Sync vendored dependencies'
run         = "vendir sync"
# —————————————————————————————————————————————————
[tasks."cue:vet"]
description = 'Validate CUE files'
run         = "cue vet -c ./..."

[tasks."cue:render"]
description = 'Render files from CUE'
dir         = "{{ config_root }}/model"
run         = "cue cmd render"

# —————————————————————————————————————————————————
[tasks."docker:build:fnox"]
description = 'Build and push image: {{vars.image_ref}}'
dir = "ops/services/images/fnox"
vars.platforms = "linux/amd64,linux/arm64"
vars.image_ref = "ghcr.io/bkenks/fnox"
vars.sem_major = 0
vars.sem_minor = 2
vars.sem_patch = 1
run = '''
version="{{vars.sem_major}}.{{vars.sem_minor}}.{{vars.sem_patch}}"

docker buildx build \
  --platform {{vars.platforms}} \
  --annotation "index:org.opencontainers.image.source=https://github.com/bkenks/infra" \
  -t "{{vars.image_ref}}:$version" \
  -t "{{vars.image_ref}}:{{vars.sem_major}}" \
  -t "{{vars.image_ref}}:latest" \
  --push .
'''

[tasks."docker:build:paseo"]
description = 'Build and push image: {{vars.image_ref}}'
dir = "ops/services/images/paseo-ktb"
vars.platforms = "linux/amd64,linux/arm64"
vars.image_ref = "ghcr.io/bkenks/paseo-ktb"
vars.sem_major = 0
vars.sem_minor = 1
vars.sem_patch = 0
run = '''
version="{{vars.sem_major}}.{{vars.sem_minor}}.{{vars.sem_patch}}"

docker buildx build \
  --platform {{vars.platforms}} \
  --annotation "index:org.opencontainers.image.source=https://github.com/bkenks/infra" \
  -t "{{vars.image_ref}}:$version" \
  -t "{{vars.image_ref}}:{{vars.sem_major}}" \
  -t "{{vars.image_ref}}:latest" \
  --push .
'''
