[tools]
cue            = "0.17.1"
lefthook       = "2"
"npm:likec4"   = "1"
"npm:wrangler" = "4"
uv             = "0.13.0"
vendir         = "0.46.2"

[env]
PATHDIR_C4 = "docs/c4"

[vars]
templateRepo = "https://github.com/bkenks/tmpl.configs"

[tasks."dependency:sync"]
description = "Sync dependencies"
run         = [{ tasks = ["copier:update", "vendir:sync"] }]

[tasks."permission:mise-tasks-add-exec"]
description = "Add execute permissions to all Mise file tasks"
run = '''
fd -H -t d -g --full-path '**/.config/mise/tasks' -X chmod -R +x
'''

[tasks."copier:copy"]
description = "Copy/Initialize repo from template"
run         = "copier copy --trust {{vars.templateRepo}} ."

[tasks."copier:update"]
description = "Update repo from template"
run         = "copier update --trust -a .config/.copier-answers.configs.yml"

[tasks."vendir:sync"]
description = "Sync vendored files into repo"
run         = "vendir sync"
