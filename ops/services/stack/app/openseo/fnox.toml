root = true

[providers.onepassword]
type  = "1password"
vault = "secrets"

[secrets]
BETTER_AUTH_SECRET = { provider = "onepassword", value = "openseo/BETTER_AUTH_SECRET" }
DATAFORSEO_API_KEY = { provider = "onepassword", value = "openseo/DATAFORSEO_API_KEY" }
OPENROUTER_API_KEY = { provider = "onepassword", value = "openrouter/credential" }
OPENROUTER_MODEL   = { default = "anthropic/claude-sonnet-5.5" }
