name: frappe

include:
  - path:
      - ../../vendor/frappe/compose.yaml
      - ../../vendor/frappe/overrides/compose.mariadb.yaml
      - ../../vendor/frappe/overrides/compose.redis.yaml
      - ../../vendor/frappe/overrides/compose.migrator.yaml

networks:
  newt_gw_001:
    external: true

services:
  frontend:
    container_name: frappe-frontend
    networks: [default, newt_gw_001]
  db:
    environment:
      MYSQL_ROOT_PASSWORD: !reset null
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

secrets:
  db_password:
    environment: DB_PASSWORD
