# GENERATED from CUE — DO NOT EDIT.
name: paperless
networks:
  pangolin-site:
    name: pangolin-site
    external: true
services:
  cache:
    container_name: paperless-cache
    restart: unless-stopped
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    image: docker.io/library/redis:8
    expose:
      - 6379
    healthcheck:
      interval: 10s
      retries: 5
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
    volumes:
      - cache_data:/data
  db:
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperless
      POSTGRES_DB: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
    image: docker.io/library/postgres:18
    expose:
      - 5432
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready --username=paperless
      timeout: 10s
    networks:
      - default
    volumes:
      - db_data:/var/lib/postgresql
  converter:
    container_name: paperless-converter
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    image: docker.io/gotenberg/gotenberg:8.25
    expose:
      - 3000
  parser:
    container_name: paperless-parser
    restart: unless-stopped
    image: docker.io/apache/tika:latest
    expose:
      - 9998
  app:
    container_name: paperless-app
    restart: unless-stopped
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
      converter:
        condition: service_started
      parser:
        condition: service_started
    environment:
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_URL: https://paper.ktbinternal.com
      PAPERLESS_TIME_ZONE: America/New_York
      PAPERLESS_DATE_ORDER: MDY
      PAPERLESS_REDIS: redis://paperless-cache:6379
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-converter:3000
      PAPERLESS_TIKA_ENDPOINT: http://paperless-parser:9998
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS:?err}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?err}
    expose:
      - 8000
    healthcheck:
      interval: 30s
      retries: 5
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8000/ || exit 1
      timeout: 10s
      start_period: 30s
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    networks:
      - default
      - pangolin-site
    volumes:
      - app_data:/usr/src/paperless/data
      - app_media:/usr/src/paperless/media
      - /srv/docker/bind-mounts/apps/paperless/export:/usr/src/paperless/export
      - /srv/docker/bind-mounts/apps/paperless/consume:/usr/src/paperless/consume
volumes:
  cache_data:
    name: paperless-cache_data
  db_data:
    name: paperless-db_data
  app_data:
    name: paperless-app_data
  app_media:
    name: paperless-app_media
