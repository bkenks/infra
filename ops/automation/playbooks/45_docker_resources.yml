---
- name: Docker resources exist
  hosts: all
  tags: [docker_resources]

  tasks:
    - name: Docker networks exist
      become: true
      community.docker.docker_network:
        name: "{{ item.name }}"
        ipam_config: "{{ item.ipam.config | default(omit) }}"
      loop: "{{ docker_networks }}"
      loop_control:
        label: "{{ item.name }}"
