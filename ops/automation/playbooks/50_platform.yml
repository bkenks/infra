---
- name: Komodo Core runs on the control plane
  hosts: control_plane
  tags: [platform, komodo_core]

  tasks:
    - name: Platform stack files are present
      ansible.builtin.import_role:
        name: docker_stack_files
      vars:
        docker_stack_files__stacks_dir: "{{ docker_stacks }}"
        docker_stack_files__repo: "https://github.com/bkenks/infra.git"
        docker_stack_files__name: platform
        docker_stack_files__repo_subdir: ops/services

    # wrap loads the 1Password token and runs compose under fnox with the stack's profile.
    - name: Komodo Core is running
      become: true
      ansible.builtin.command:
        cmd: ../../wrap docker compose up -d
        chdir: "{{ docker_stacks }}/platform/out/komodo"
      register: komodo_core__up
      changed_when: komodo_core__up.stderr is search('Creat|Recreat|Start')

- name: Komodo Periphery runs on every host
  hosts: all
  tags: [platform, komodo_periphery]

  tasks:
    - name: Komodo Periphery is installed and configured
      ansible.builtin.import_role:
        name: bpbradley.komodo

- name: Backrest runs on every host
  hosts: all
  tags: [platform, backrest]

  tasks:
    - name: Backrest is installed
      ansible.builtin.import_role:
        name: backrest
