---
- name: Hosts run Docker and git
  hosts: all
  tags: [runtime]

  tasks:
    - name: Docker directories exist
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ user_admin }}"
        group: "{{ user_admin }}"
        mode: "2770"
      loop:
        - "{{ dockerShare }}"
        - "{{ dockerFiles }}"
        - "{{ dockerStacks }}"
        - "{{ dockerBindMounts }}"

    - name: Docker is installed
      become: true
      ansible.builtin.import_role:
        name: geerlingguy.docker

    - name: Git is installed
      ansible.builtin.import_role:
        name: git
