- name: Create a group for servers
  community.ansible_netbird.netbird_group:
    name: servers
    state: present
  register: netbird__servers_group

- name: Create a reusable setup key for servers
  community.ansible_netbird.netbird_netbird__setup_key:
    name: server-enrollment
    key_type: reusable
    expires_in: 604800
    auto_groups:
      - "{{ netbird__servers_group.group.id }}"
    state: present
  register: netbird__setup_key

- name: Save the setup key (its secret is returned only on creation)
  ansible.builtin.copy:
    content: "{{ netbird__setup_key.netbird__setup_key.key }}"
    dest: ./server-enrollment.key
    mode: "0600"
  no_log: true
  when: netbird__setup_key.netbird__setup_key.key is defined
