---
- name: Read the installed 1Password CLI version
  ansible.builtin.command: "{{ onepassword__install_dir }}/op --version"
  register: onepassword__installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure unzip, which the 1Password CLI archive needs
  when: onepassword__version not in onepassword__installed.stdout | default('')
  become: true
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Install the 1Password CLI fnox's 1password provider shells out to, version {{ onepassword__version }}
  when: onepassword__version not in onepassword__installed.stdout | default('')
  become: true
  ansible.builtin.unarchive:
    src: "{{ onepassword__install_url }}"
    dest: "{{ onepassword__install_dir }}"
    remote_src: true
    include: [op]
    owner: root
    group: root
    mode: "0755"
