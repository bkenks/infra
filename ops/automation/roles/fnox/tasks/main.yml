---
- name: Read the installed fnox version
  ansible.builtin.command: "{{ fnox__install_dir }}/fnox --version"
  register: fnox__installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install fnox {{ fnox__version }}
  when: fnox__version not in fnox__installed.stdout | default('')
  become: true
  ansible.builtin.unarchive:
    src: "{{ fnox__url }}"
    dest: "{{ fnox__install_dir }}"
    remote_src: true
    include: [fnox]
    owner: root
    group: root
    mode: "0755"
