---
- name: Ensure Backrest is installed
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL https://raw.githubusercontent.com/garethgeorge/backrest/main/install.sh
      | bash
    executable: /bin/bash
    creates: /usr/local/bin/backrest
  become: true

- name: Ensure the Backrest drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/backrest.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Let Backrest read every file it backs up
  ansible.builtin.copy:
    dest: /etc/systemd/system/backrest.service.d/99-read-capability.conf
    content: |
      [Service]
      AmbientCapabilities=CAP_DAC_READ_SEARCH
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart Backrest

- name: Ensure Backrest is configured
  ansible.builtin.import_tasks: config.yml
