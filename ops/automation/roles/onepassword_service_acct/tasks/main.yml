---
- name: Read the host's service-account token
  become: true
  no_log: true
  check_mode: false
  ansible.builtin.slurp:
    src: "{{ onepassword_service_acct__dest }}"
  register: onepassword_service_acct__host_file
  failed_when: false

- name: Resolve the service-account token on the controller
  delegate_to: localhost
  become: false
  no_log: true
  environment:
    OP_ACCOUNT: "{{ onepassword_service_acct__account }}"
    OP_CACHE: "false"
    OP_SERVICE_ACCOUNT_TOKEN: ""
  block:
    - name: Read the stored service-account token
      check_mode: false
      ansible.builtin.command:
        argv:
          - op
          - item
          - get
          - "{{ onepassword_service_acct__item }}"
          - --vault={{ onepassword_service_acct__vault }}
          - --fields=credential
          - --reveal
      register: onepassword_service_acct__stored
      changed_when: false
      failed_when:
        - onepassword_service_acct__stored.rc != 0
        - '"isn''t an item" not in onepassword_service_acct__stored.stderr'

    - name: Validate the host and stored tokens
      check_mode: false
      ansible.builtin.command:
        argv: [op, whoami]
      environment:
        OP_SERVICE_ACCOUNT_TOKEN: "{{ item }}"
      loop: "{{ onepassword_service_acct__candidates }}"
      register: onepassword_service_acct__validations
      changed_when: false
      failed_when: false

    - name: Mint the service account {{ onepassword_service_acct__name }}
      when: onepassword_service_acct__valid_tokens | length == 0
      ansible.builtin.command:
        argv: >-
          {{ ['op', 'service-account', 'create', onepassword_service_acct__name, '--raw']
             + onepassword_service_acct__vaults | map('regex_replace', '^', '--vault=') | list }}
      register: onepassword_service_acct__minted
      changed_when: true

    - name: Archive the stale stored token
      when:
        - onepassword_service_acct__item_exists
        - onepassword_service_acct__token | length > 0
        - onepassword_service_acct__token != onepassword_service_acct__stored_token
      ansible.builtin.command:
        argv:
          - op
          - item
          - delete
          - "{{ onepassword_service_acct__item }}"
          - --vault={{ onepassword_service_acct__vault }}
          - --archive
      changed_when: true

    - name: Store the token in 1Password
      when:
        - onepassword_service_acct__token | length > 0
        - onepassword_service_acct__token != onepassword_service_acct__stored_token
      ansible.builtin.command:
        argv:
          [
            op,
            item,
            create,
            "--vault={{ onepassword_service_acct__vault }}",
            "-",
          ]
        stdin: "{{ onepassword_service_acct__item_template | to_json }}"
      changed_when: true

- name: Place the token on the host
  when:
    - onepassword_service_acct__token | length > 0
    - onepassword_service_acct__token != onepassword_service_acct__host_token
  become: true
  no_log: true
  ansible.builtin.copy:
    content: "OP_SERVICE_ACCOUNT_TOKEN={{ onepassword_service_acct__token }}\n"
    dest: "{{ onepassword_service_acct__dest }}"
    owner: "{{ onepassword_service_acct__owner }}"
    group: "{{ onepassword_service_acct__owner }}"
    mode: "0600"
