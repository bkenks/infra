---
# Backrest config owned by Ansible; see roles/backrest/README.md. Per-host
# plans go in host_vars as backrest__plans.
backrest__repos:
  - id: ktb-backup-app
    uri: s3:https://s3.us-east-005.backblazeb2.com/ktb-backup-app
    guid: ab983b591c2ef4341b4167175a28a23ef23ad8b185a4587124104535127daa62
    password: "{{ lookup('env', 'BACKREST_KTB_BACKUP_APP_PASSWORD') }}"
    env:
      - "AWS_ACCESS_KEY_ID={{ lookup('env', 'BACKREST_KTB_BACKUP_APP_AWS_ACCESS_KEY_ID') }}"
      - "AWS_SECRET_ACCESS_KEY={{ lookup('env', 'BACKREST_KTB_BACKUP_APP_AWS_SECRET_ACCESS_KEY') }}"
    prunePolicy:
      schedule:
        maxFrequencyDays: 7
        clock: CLOCK_LAST_RUN_TIME
      maxUnusedPercent: 10
    checkPolicy:
      schedule:
        maxFrequencyDays: 30
        clock: CLOCK_LAST_RUN_TIME
      readDataSubsetPercent: 5
    forgetPolicy:
      schedule:
        disabled: true
        clock: CLOCK_LAST_RUN_TIME
      retention:
        policyTimeBucketed:
          hourly: 24
          daily: 7
          weekly: 4
          monthly: 3
