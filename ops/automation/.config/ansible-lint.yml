---
# Paths here are resolved relative to the PROJECT ROOT, not to this file.

profile: moderate

skip_list:
  - no-handler
  - empty-playbook
  - yaml[colons]

# Galaxy-installed roles and collections are third-party source; lint only what
# this repo owns.
exclude_paths:
  - .ansible/
  - .claude/  # agent scratch space, including git worktrees of this repo
  - .copier-answers.yml  # generated by copier; "NEVER EDIT MANUALLY"
