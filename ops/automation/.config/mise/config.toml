#:schema https://mise.jdx.dev/schema/mise.json

[tools]
uv = "0.13.0"

[settings]
python.uv_venv_auto = "create|source"

[hooks]
postinstall = '''
mise run init:uv
mise run init:ansible
'''

[tasks]
"fnox:pull"         = "fnox sync --source onepassword --local-file --force"
"init:ansible"      = "ansible-galaxy install -r requirements.yml"
"init:uv"           = "uv sync"
lint                = "uv run ansible-lint --offline"
"place-secrets"     = "uv run ansible-playbook playbooks/maintenance/place_secrets.yml"
"playbook:run:full" = "uv run ansible-playbook playbooks/site.yml"

[tasks."init:netbird"]
run = '''
mkdir -p .tmp && cd .tmp
git clone https://github.com/netbirdio/ansible-netbird.git && cd ansible-netbird

ansible-galaxy collection build
ansible-galaxy collection install community-ansible_netbird-*.tar.gz

cd {{config_root}}
rm -rf .tmp/ansible-netbird
'''