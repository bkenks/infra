---
- name: Assert the connection is a non-root user
  ansible.builtin.assert:
    that:
      - ansible_facts.user_id != 'root'
    fail_msg: >-
      Refusing to lock root while connected as root: there would be no
      non-root way back in afterwards.

- name: Assert the connection can elevate without a password
  ansible.builtin.command: sudo -n whoami
  changed_when: false
  register: access__sudo_probe
  failed_when: access__sudo_probe.stdout != 'root'

- name: Lock the root account password
  ansible.builtin.user:
    name: root
    password_lock: true
